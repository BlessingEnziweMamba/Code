<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graph G</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f13;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Crimson Pro', Georgia, serif;
    color: #e8e0d0;
    padding: 2rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
    color: #f0e8d8;
  }

  .subtitle {
    font-style: italic;
    color: #9090a0;
    font-size: 1rem;
    margin-bottom: 2rem;
  }

  .canvas-wrap {
    background: #16161e;
    border: 1px solid #2e2e40;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  svg {
    display: block;
  }

  .legend {
    margin-top: 1.8rem;
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.92rem;
    color: #b0a898;
  }

  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
  }

  .legend-line {
    width: 28px; height: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<h1>Graph <em>G</em></h1>
<p class="subtitle">Multigraph with parallel edges and a loop</p>

<div class="canvas-wrap">
<svg width="520" height="380" viewBox="0 0 520 380">
  <defs>
    <!-- glow filters -->
    <filter id="glow-teal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-node" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 
    Vertex positions:
    v1: (130, 180)
    v2: (280, 180)
    v3: (390, 260)
    v4: (420, 100)  isolated
    v5: (80,  80)   isolated
  -->

  <!-- e1: straight edge v1-v2 (slightly above center) -->
  <path d="M 130,180 Q 205,148 280,180"
        fill="none" stroke="#4ecdc4" stroke-width="2.5" opacity="0.9" filter="url(#glow-teal)"/>
  <text x="200" y="151" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="15"
        fill="#4ecdc4" opacity="0.95">e₁</text>

  <!-- e2: parallel edge v1-v2 (below) -->
  <path d="M 130,180 Q 205,212 280,180"
        fill="none" stroke="#ff6b6b" stroke-width="2.5" opacity="0.9" filter="url(#glow-teal)"/>
  <text x="200" y="224" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="15"
        fill="#ff6b6b" opacity="0.95">e₂</text>

  <!-- e3: edge v2-v3 -->
  <line x1="280" y1="180" x2="390" y2="260"
        stroke="#f7c59f" stroke-width="2.5" opacity="0.9" filter="url(#glow-teal)"/>
  <text x="344" y="213" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="15"
        fill="#f7c59f" opacity="0.95">e₃</text>

  <!-- e4: loop at v2 -->
  <path d="M 280,180 C 320,130 370,130 340,180"
        fill="none" stroke="#c77dff" stroke-width="2.5" opacity="0.9" filter="url(#glow-teal)"/>
  <text x="340" y="128" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="15"
        fill="#c77dff" opacity="0.95">e₄</text>

  <!-- Vertices -->
  <!-- v1 -->
  <circle cx="130" cy="180" r="18" fill="#1e1e2e" stroke="#4ecdc4" stroke-width="2.5" filter="url(#glow-node)"/>
  <text x="130" y="185" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="16" fill="#e8e0d0">v₁</text>

  <!-- v2 -->
  <circle cx="280" cy="180" r="18" fill="#1e1e2e" stroke="#f0d080" stroke-width="2.5" filter="url(#glow-node)"/>
  <text x="280" y="185" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="16" fill="#e8e0d0">v₂</text>

  <!-- v3 -->
  <circle cx="390" cy="260" r="18" fill="#1e1e2e" stroke="#4ecdc4" stroke-width="2.5" filter="url(#glow-node)"/>
  <text x="390" y="265" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="16" fill="#e8e0d0">v₃</text>

  <!-- v4 isolated -->
  <circle cx="420" cy="100" r="18" fill="#1e1e2e" stroke="#555570" stroke-width="2" opacity="0.8"/>
  <text x="420" y="105" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="16" fill="#808090">v₄</text>

  <!-- v5 isolated -->
  <circle cx="80" cy="80" r="18" fill="#1e1e2e" stroke="#555570" stroke-width="2" opacity="0.8"/>
  <text x="80" y="85" text-anchor="middle"
        font-family="'Crimson Pro', serif" font-style="italic" font-size="16" fill="#808090">v₅</text>

</svg>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-line" style="background:#4ecdc4;"></div>
    <span>e₁ — {v₁, v₂}</span>
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background:#ff6b6b;"></div>
    <span>e₂ — {v₁, v₂} parallel</span>
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background:#f7c59f;"></div>
    <span>e₃ — {v₂, v₃}</span>
  </div>
  <div class="legend-item">
    <div class="legend-line" style="background:#c77dff;"></div>
    <span>e₄ — loop at v₂</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#555570;"></div>
    <span>v₄, v₅ — isolated</span>
  </div>
</div>

</body>
</html>
